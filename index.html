<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="version" content="3.0">

    <!-- ===== FAVICON ===== -->
    <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/style.css">

    <title>✅ Minhas Tarefas</title>
</head>
<body>

    <!-- ==================== STATUS DE CONEXÃO ==================== -->
    <div id="connectionStatus" class="connection-status">
        <span class="status-dot"></span>
        <span id="connectionText">Conectado</span>
    </div>

    <!-- ==================== SIDEBAR ==================== -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-profile">
            <div class="sidebar-avatar" id="profileAvatar">👤</div>
            <h2 id="profileName">Usuário</h2>
            <p id="profileEmail">usuario@email.com</p>
        </div>
        <nav class="sidebar-menu">
            <button class="menu-item active" data-page="tasks">
                <span class="menu-icon">📋</span> Minhas Tarefas
                <span class="menu-badge" id="taskCount">0</span>
            </button>
            <button class="menu-item" data-page="profile">
                <span class="menu-icon">👤</span> Meu Perfil
            </button>
            <button class="menu-item" data-page="stats">
                <span class="menu-icon">📊</span> Estatísticas
            </button>

            <div class="menu-divider"></div>

            <!-- Modo Escuro -->
            <button class="dark-mode-toggle" id="darkModeToggle">
                <span class="toggle-icon" id="darkModeIcon">🌙</span>
                <span class="toggle-label" id="darkModeLabel">Modo Escuro</span>
                <span class="toggle-switch"></span>
            </button>

            <div class="menu-divider"></div>

            <!-- Gerenciamento de Dados -->
            <button class="menu-item" id="exportDataBtn">
                <span class="menu-icon">📤</span> Exportar Dados
            </button>
            <label class="import-label" id="importDataLabel">
                <span class="menu-icon">📥</span> Importar Dados
                <input type="file" id="importFileInput" class="hidden-input" accept=".json">
            </label>
            <button class="menu-item" id="archiveTasksBtn">
                <span class="menu-icon">📦</span> Arquivar Concluídas
            </button>
            <button class="menu-item" id="resetAppBtn">
                <span class="menu-icon">🔄</span> Reset App
            </button>
            <button class="menu-item" id="clearAllData">
                <span class="menu-icon">🗑️</span> Limpar Dados
            </button>

            <div class="menu-divider"></div>

            <button class="menu-item" id="installAppMenu">
                <span class="menu-icon">📲</span> Instalar App
            </button>
            <button class="menu-item" id="logoutBtn">
                <span class="menu-icon">🚪</span> Sair
            </button>
        </nav>
    </aside>

    <!-- ==================== MAIN ==================== -->
    <main class="main-content">
        <div class="container">
            <header>
                <button class="menu-toggle" id="menuToggle">☰</button>
                <div class="header-title">
                    <h1>✅ Tarefas <span class="subtitle">• organizadas</span></h1>
                </div>
                <div class="header-status">
                    <span class="dot online" id="statusDot"></span>
                    <span id="statusText">Online</span>
                </div>
            </header>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">📋 Todas</button>
                <button class="filter-btn" data-filter="pending">⏳ Pendentes</button>
                <button class="filter-btn" data-filter="completed">✅ Concluídas</button>
            </div>

            <div class="task-counter">
                <span>Mostrando <span class="count" id="showingCount">0</span> tarefas</span>
                <span><span class="count" id="pendingCount">0</span> pendentes</span>
            </div>

            <ul id="taskList"></ul>

            <button class="fab fab-pulse" id="fabAddTask">✚</button>

            <button class="fab-share" id="fabShareWhatsApp">
                <span class="whatsapp-icon">
                    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                </span>
            </button>

            <div class="footer">
                <div class="signature">
                    <span>🚀 Desenvolvido por</span>
                    <span class="dev-name">Adriano Monteiro</span>
                    <span class="separator">|</span>
                    <span class="heart">❤️</span>
                    <span class="separator">|</span>
                    <a href="mailto:adri0mt@uni9.edu.br" class="email-link">📧 adri0mt@uni9.edu.br</a>
                    <span class="separator">|</span>
                    <span>v3.0</span>
                </div>
            </div>
        </div>
    </main>

    <!-- ==================== MODAIS ==================== -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h2 id="modalTitle">✚ Nova Tarefa</h2>
                <button class="modal-close" id="modalTaskClose">✕</button>
            </div>
            <form id="taskForm">
                <input type="hidden" id="editTaskId">
                <label for="taskInput">📝 O que precisa fazer?</label>
                <input type="text" id="taskInput" placeholder="Ex: Estudar JavaScript" required>

                <label for="taskOrder">🔢 Nº Ordem</label>
                <input type="text" id="taskOrder" placeholder="Ex: 001, 002, ou A-01">

                <label for="taskObs">📝 Obs.</label>
                <textarea id="taskObs" placeholder="Observações sobre a tarefa..."></textarea>

                <label>📍 Endereço <span style="color:var(--text-muted);font-weight:400;">(opcional)</span></label>
                <div class="modal-address-section">
                    <div class="search-header">
                        <input type="text" id="modalAddressSearch" placeholder="Buscar endereço...">
                        <button id="modalSearchBtn">🔍 Buscar</button>
                    </div>
                    <div id="modalSuggestions" class="modal-suggestions"></div>
                    <div id="modalSelectedAddress" class="modal-selected-address">
                        <div id="modalSelectedText"></div>
                        <div class="address-actions">
                            <button id="modalClearAddress">✖ Limpar</button>
                        </div>
                    </div>
                </div>

                <button type="submit" id="modalSubmitBtn">✅ Adicionar Tarefa</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay modal-profile" id="profileModal">
        <div class="modal">
            <div class="modal-header">
                <h2>👤 Meu Perfil</h2>
                <button class="modal-close" id="modalProfileClose">✕</button>
            </div>
            <form id="profileForm">
                <div style="text-align:center;"><div class="modal-avatar" id="modalAvatar">👤</div></div>
                <label for="modalName">Nome</label>
                <input type="text" id="modalName" placeholder="Seu nome" required>
                <label for="modalEmail">Email</label>
                <input type="email" id="modalEmail" placeholder="seu@email.com" required>
                <button type="submit">💾 Salvar Perfil</button>
            </form>
        </div>
    </div>

    <!-- ==================== INSTALL BANNER ==================== -->
    <div class="install-banner" id="installBanner">
        <div class="install-info">
            <span class="install-icon">📱</span>
            <div class="install-text">
                <strong>Instale o App</strong>
                <span>Adicione à tela inicial para acesso rápido</span>
            </div>
        </div>
        <div class="install-actions">
            <button class="install-btn" id="installBtn">📲 Instalar</button>
            <button class="install-close" id="installClose">✕</button>
        </div>
    </div>

    <!-- ==================== TOAST ==================== -->
    <div id="toast" class="toast"></div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
