    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // ============================================
        // CLASSE PRINCIPAL
        // ============================================
        class TaskManager {
            constructor() {
                this.tasks = [];
                this.currentFilter = 'all';
                this.selectedAddress = null;
                this.isSearching = false;
                this.isOnline = navigator.onLine;
                this.searchTimeout = null;
                this.editingTaskId = null;
                this.deferredPrompt = null;
                
                // Drag & Drop
                this.draggingItem = null;
                this.dragOverItem = null;
                this.isDragging = false;
                this.longPressTimer = null;
                this.isLongPress = false;
                this.dragClone = null;
                this.startY = 0;
                this.currentY = 0;
                this.scrollInterval = null;
                this.dragOffsetY = 0;
                this.isDraggingActive = false;
                this.boundOnDragMove = null;
                this.boundOnDragEnd = null;
                
                this.profile = {
                    name: 'Usuário',
                    email: 'usuario@email.com',
                    avatar: '👤'
                };
                
                this.loadTasks();
                this.loadProfile();
                this.initializeDOM();
                this.bindEvents();
                this.render();
                this.updateSidebarStats();
                this.checkConnection();
                this.setupConnectionListeners();
                this.setupPWA();
                
                setTimeout(() => {
                    if (this.isOnline) {
                        this.showToast('📋 Tarefas carregadas!');
                    }
                }, 500);
            }

            // ========== DOM REFERÊNCIAS ==========
            initializeDOM() {
                // Principais
                this.taskList = document.getElementById('taskList');
                this.filterBtns = document.querySelectorAll('.filter-btn');
                this.showingCount = document.getElementById('showingCount');
                this.pendingCount = document.getElementById('pendingCount');
                this.toast = document.getElementById('toast');

                // Status
                this.connectionStatus = document.getElementById('connectionStatus');
                this.connectionText = document.getElementById('connectionText');
                this.statusDot = document.getElementById('statusDot');
                this.statusText = document.getElementById('statusText');

                // Sidebar
                this.sidebar = document.getElementById('sidebar');
                this.sidebarOverlay = document.getElementById('sidebarOverlay');
                this.menuToggle = document.getElementById('menuToggle');
                this.menuItems = document.querySelectorAll('.menu-item');
                this.profileName = document.getElementById('profileName');
                this.profileEmail = document.getElementById('profileEmail');
                this.profileAvatar = document.getElementById('profileAvatar');
                this.taskCount = document.getElementById('taskCount');

                // Modal Tarefa
                this.taskModal = document.getElementById('taskModal');
                this.modalTitle = document.getElementById('modalTitle');
                this.taskForm = document.getElementById('taskForm');
                this.taskInput = document.getElementById('taskInput');
                this.taskOrder = document.getElementById('taskOrder');
                this.taskObs = document.getElementById('taskObs');
                this.editTaskId = document.getElementById('editTaskId');
                this.modalSubmitBtn = document.getElementById('modalSubmitBtn');
                this.modalTaskClose = document.getElementById('modalTaskClose');
                this.fabAddTask = document.getElementById('fabAddTask');

                // Modal Endereço
                this.modalAddressSearch = document.getElementById('modalAddressSearch');
                this.modalSearchBtn = document.getElementById('modalSearchBtn');
                this.modalSuggestions = document.getElementById('modalSuggestions');
                this.modalSelectedAddress = document.getElementById('modalSelectedAddress');
                this.modalSelectedText = document.getElementById('modalSelectedText');
                this.modalClearAddress = document.getElementById('modalClearAddress');

                // Modal Perfil
                this.profileModal = document.getElementById('profileModal');
                this.modalProfileClose = document.getElementById('modalProfileClose');
                this.profileForm = document.getElementById('profileForm');
                this.modalName = document.getElementById('modalName');
                this.modalEmail = document.getElementById('modalEmail');
                this.modalAvatar = document.getElementById('modalAvatar');

                // Ações
                this.clearAllData = document.getElementById('clearAllData');
                this.logoutBtn = document.getElementById('logoutBtn');

                // Compartilhamento
                this.fabShareWhatsApp = document.getElementById('fabShareWhatsApp');

                // PWA Install
                this.installBanner = document.getElementById('installBanner');
                this.installBtn = document.getElementById('installBtn');
                this.installClose = document.getElementById('installClose');
            }

            // ========== PWA ==========
            setupPWA() {
                // Verifica se já foi instalado ou se o banner foi fechado
                if (localStorage.getItem('installBannerClosed')) {
                    this.installBanner.classList.remove('show');
                }

                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    this.deferredPrompt = e;
                    if (!localStorage.getItem('installBannerClosed')) {
                        this.installBanner.classList.add('show');
                    }
                });

                window.addEventListener('appinstalled', () => {
                    this.installBanner.classList.remove('show');
                    localStorage.setItem('installBannerClosed', 'true');
                    this.showToast('✅ App instalado com sucesso!');
                });

                this.installBtn.addEventListener('click', async () => {
                    if (this.deferredPrompt) {
                        this.deferredPrompt.prompt();
                        const result = await this.deferredPrompt.userChoice;
                        if (result.outcome === 'accepted') {
                            this.installBanner.classList.remove('show');
                            localStorage.setItem('installBannerClosed', 'true');
                            this.showToast('✅ App instalado!');
                        }
                        this.deferredPrompt = null;
                    } else {
                        // Fallback: instruções para instalação manual
                        this.showToast('📱 Toque em "Adicionar à Tela Inicial" no menu do navegador');
                        this.installBanner.classList.remove('show');
                    }
                });

                this.installClose.addEventListener('click', () => {
                    this.installBanner.classList.remove('show');
                    localStorage.setItem('installBannerClosed', 'true');
                });

                // Detecta se já está no modo standalone (já instalado)
                if (window.matchMedia('(display-mode: standalone)').matches) {
                    this.installBanner.classList.remove('show');
                }
            }

            // ========== CONEXÃO ==========
            checkConnection() {
                this.isOnline = navigator.onLine;
                this.updateConnectionUI();
            }

            setupConnectionListeners() {
                window.addEventListener('online', () => {
                    this.isOnline = true;
                    this.updateConnectionUI();
                    this.showToast('🌐 Conexão restaurada!');
                });

                window.addEventListener('offline', () => {
                    this.isOnline = false;
                    this.updateConnectionUI();
                    this.showToast('📶 Modo offline ativado');
                });

                setInterval(() => {
                    const wasOnline = this.isOnline;
                    this.isOnline = navigator.onLine;
                    if (wasOnline !== this.isOnline) {
                        this.updateConnectionUI();
                        if (this.isOnline) {
                            this.showToast('🌐 Conexão restaurada!');
                        } else {
                            this.showToast('📶 Modo offline ativado');
                        }
                    }
                }, 5000);
            }

            updateConnectionUI() {
                const status = this.connectionStatus;
                const text = this.connectionText;
                const dot = this.statusDot;
                const statusText = this.statusText;

                if (this.isOnline) {
                    status.className = 'connection-status online';
                    text.textContent = '🟢 Conectado';
                    dot.className = 'dot online';
                    statusText.textContent = 'Online';
                } else {
                    status.className = 'connection-status offline';
                    text.textContent = '🔴 Modo Offline';
                    dot.className = 'dot offline';
                    statusText.textContent = 'Offline';
                }

                status.style.transform = 'translateY(0)';
                clearTimeout(this.statusTimeout);
                this.statusTimeout = setTimeout(() => {
                    status.style.transform = 'translateY(-100%)';
                }, 3000);
            }

            // ========== PERFIL ==========
            loadProfile() {
                try {
                    const saved = localStorage.getItem('profile');
                    if (saved) {
                        this.profile = JSON.parse(saved);
                        this.updateProfileUI();
                    }
                } catch (e) {
                    console.error('Erro ao carregar perfil:', e);
                }
            }

            saveProfile() {
                try {
                    localStorage.setItem('profile', JSON.stringify(this.profile));
                    this.updateProfileUI();
                } catch (e) {
                    console.error('Erro ao salvar perfil:', e);
                }
            }

            updateProfileUI() {
                this.profileName.textContent = this.profile.name;
                this.profileEmail.textContent = this.profile.email;
                this.profileAvatar.textContent = this.profile.avatar || '👤';
            }

            // ========== PERSISTÊNCIA ==========
            loadTasks() {
                try {
                    const saved = localStorage.getItem('tasks');
                    if (saved) {
                        this.tasks = JSON.parse(saved);
                    } else {
                        this.tasks = [];
                    }
                } catch (e) {
                    console.error('Erro ao carregar tarefas:', e);
                    this.tasks = [];
                }
            }

            saveTasks() {
                try {
                    localStorage.setItem('tasks', JSON.stringify(this.tasks));
                    this.updateStats();
                    this.updateSidebarStats();
                } catch (e) {
                    console.error('Erro ao salvar tarefas:', e);
                }
            }

            // ========== ESTATÍSTICAS ==========
            updateStats() {
                const total = this.tasks.length;
                const completed = this.tasks.filter(task => task.completed).length;
                const pending = total - completed;
                
                if (this.pendingCount) {
                    this.pendingCount.textContent = pending;
                }
            }

            updateSidebarStats() {
                const pending = this.tasks.filter(t => !t.completed).length;
                if (this.taskCount) {
                    this.taskCount.textContent = pending;
                }
            }

            // ========== SIDEBAR ==========
            toggleSidebar() {
                this.sidebar.classList.toggle('open');
                this.sidebarOverlay.classList.toggle('active');
            }

            closeSidebar() {
                this.sidebar.classList.remove('open');
                this.sidebarOverlay.classList.remove('active');
            }

            // ========== MODAL TAREFA ==========
            openTaskModal(taskId = null) {
                this.editingTaskId = taskId;
                this.clearModalAddress();
                
                if (taskId !== null) {
                    const task = this.tasks.find(t => t.id === taskId);
                    if (task) {
                        this.modalTitle.textContent = '✏️ Editar Tarefa';
                        this.modalSubmitBtn.textContent = '💾 Salvar Alterações';
                        this.taskInput.value = task.text;
                        this.taskOrder.value = task.ordem || '';
                        this.taskObs.value = task.obs || '';
                        this.editTaskId.value = taskId;
                        
                        if (task.endereco) {
                            this.selectedAddress = { ...task.endereco };
                            this.modalSelectedText.innerHTML = `
                                <strong>📍 Endereço:</strong><br>
                                ${this.formatAddressDisplay(task.endereco)}
                            `;
                            this.modalSelectedAddress.classList.add('active');
                            this.modalAddressSearch.value = task.endereco.display_name || '';
                        }
                    }
                } else {
                    this.modalTitle.textContent = '✚ Nova Tarefa';
                    this.modalSubmitBtn.textContent = '✅ Adicionar Tarefa';
                    this.taskInput.value = '';
                    this.taskOrder.value = '';
                    this.taskObs.value = '';
                    this.editTaskId.value = '';
                }
                
                this.taskModal.classList.add('active');
                setTimeout(() => this.taskInput.focus(), 400);
                this.closeSidebar();
            }

            closeTaskModal() {
                this.taskModal.classList.remove('active');
                this.clearModalAddress();
                this.modalSuggestions.classList.remove('active');
                this.editingTaskId = null;
            }

            // ========== MODAL PERFIL ==========
            openProfileModal() {
                this.modalName.value = this.profile.name;
                this.modalEmail.value = this.profile.email;
                this.modalAvatar.textContent = this.profile.avatar || '👤';
                this.profileModal.classList.add('active');
                this.closeSidebar();
            }

            closeProfileModal() {
                this.profileModal.classList.remove('active');
            }

            // ========== BUSCA ENDEREÇO COM DELAY ==========
            async buscarEnderecoModal(query) {
                if (!query || query.trim().length < 3) {
                    this.modalSuggestions.classList.remove('active');
                    return;
                }

                if (!this.isOnline) {
                    this.showToast('📶 Modo offline - Busca indisponível');
                    return;
                }

                this.isSearching = true;
                this.modalSearchBtn.disabled = true;
                this.modalSearchBtn.textContent = '⏳ Buscando...';
                this.modalSuggestions.classList.remove('active');

                try {
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&countrycodes=br&addressdetails=1&accept-language=pt-BR`;
                    
                    const response = await fetch(url, {
                        headers: { 'User-Agent': 'TaskApp/1.0' }
                    });
                    
                    const data = await response.json();

                    if (data.length === 0) {
                        this.showToast('📍 Nenhum endereço encontrado');
                        this.modalSuggestions.innerHTML = `
                            <div class="modal-suggestion-item" style="color: #999; cursor: default;">
                                Nenhum endereço encontrado
                            </div>
                        `;
                        this.modalSuggestions.classList.add('active');
                        return;
                    }

                    this.renderSuggestionsModal(data);
                } catch (error) {
                    console.error('Erro:', error);
                    if (!this.isOnline) {
                        this.showToast('📶 Sem conexão para buscar endereços');
                    } else {
                        this.showToast('⚠️ Erro ao buscar endereço');
                    }
                } finally {
                    this.isSearching = false;
                    this.modalSearchBtn.disabled = false;
                    this.modalSearchBtn.textContent = '🔍 Buscar';
                }
            }

            renderSuggestionsModal(data) {
                this.modalSuggestions.innerHTML = data.map(item => {
                    const displayName = item.display_name;
                    const type = item.type;
                    const icon = this.getAddressIcon(type);
                    const detail = this.formatAddressDetail(item);

                    return `
                        <div class="modal-suggestion-item" data-address='${JSON.stringify(item)}'>
                            <div class="suggestion-main">${icon} ${displayName}</div>
                            <div class="suggestion-detail">${detail}</div>
                        </div>
                    `;
                }).join('');

                this.modalSuggestions.classList.add('active');

                this.modalSuggestions.querySelectorAll('.modal-suggestion-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const addressData = JSON.parse(el.dataset.address);
                        this.selectAddressModal(addressData);
                    });
                });
            }

            getAddressIcon(type) {
                const icons = {
                    'administrative': '🏛️',
                    'village': '🏘️',
                    'town': '🏙️',
                    'city': '🏙️',
                    'state': '🗺️',
                    'road': '🛤️',
                    'building': '🏢',
                    'house': '🏠',
                    'amenity': '📍',
                    'shop': '🛍️'
                };
                return icons[type] || '📍';
            }

            formatAddressDetail(item) {
                const parts = [];
                if (item.address?.road) parts.push(item.address.road);
                if (item.address?.suburb) parts.push(item.address.suburb);
                if (item.address?.city) parts.push(item.address.city);
                if (item.address?.state) parts.push(item.address.state);
                if (item.address?.postcode) parts.push(`CEP: ${item.address.postcode}`);
                return parts.join(' • ') || item.class;
            }

            selectAddressModal(addressData) {
                const address = {
                    display_name: addressData.display_name,
                    lat: addressData.lat,
                    lon: addressData.lon,
                    cep: addressData.address?.postcode || '',
                    logradouro: addressData.address?.road || '',
                    bairro: addressData.address?.suburb || addressData.address?.neighbourhood || '',
                    cidade: addressData.address?.city || addressData.address?.town || addressData.address?.village || '',
                    uf: addressData.address?.state || '',
                    pais: addressData.address?.country || 'Brasil'
                };

                this.selectedAddress = address;
                this.modalSelectedText.innerHTML = `
                    <strong>📍 Endereço:</strong><br>
                    ${this.formatAddressDisplay(address)}
                `;
                this.modalSelectedAddress.classList.add('active');
                this.modalSuggestions.classList.remove('active');
                this.modalAddressSearch.value = address.display_name;
                this.showToast('✅ Endereço selecionado!');
            }

            formatAddressDisplay(address) {
                let parts = [];
                if (address.logradouro) parts.push(address.logradouro);
                if (address.bairro) parts.push(address.bairro);
                if (address.cidade) parts.push(address.cidade);
                if (address.uf) parts.push(address.uf);
                if (address.cep) parts.push(`CEP: ${address.cep}`);
                return parts.join(' - ');
            }

            clearModalAddress() {
                this.selectedAddress = null;
                this.modalSelectedAddress.classList.remove('active');
                this.modalAddressSearch.value = '';
                this.modalSuggestions.classList.remove('active');
            }

            // ========== CRUD ==========
            addTask(text, endereco, ordem, obs) {
                if (!text || !text.trim()) {
                    this.showToast('⚠️ Digite uma tarefa!');
                    return false;
                }

                const task = {
                    id: Date.now(),
                    text: text.trim(),
                    completed: false,
                    createdAt: new Date().toLocaleString('pt-BR'),
                    endereco: endereco || null,
                    ordem: ordem || '',
                    obs: obs || '',
                    order: this.tasks.length
                };

                this.tasks.push(task);
                this.saveTasks();
                this.render();
                this.closeTaskModal();
                
                const msg = endereco ? `✅ "${task.text}" com endereço!` : `✅ "${task.text}" adicionada!`;
                this.showToast(msg);
                return true;
            }

            updateTask(id, text, endereco, ordem, obs) {
                if (!text || !text.trim()) {
                    this.showToast('⚠️ Digite uma tarefa!');
                    return false;
                }

                const task = this.tasks.find(t => t.id === id);
                if (!task) {
                    this.showToast('⚠️ Tarefa não encontrada');
                    return false;
                }

                task.text = text.trim();
                task.endereco = endereco || null;
                task.ordem = ordem || '';
                task.obs = obs || '';

                this.saveTasks();
                this.render();
                this.closeTaskModal();
                this.showToast(`✅ "${task.text}" atualizada!`);
                return true;
            }

            deleteTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    this.tasks = this.tasks.filter(t => t.id !== id);
                    this.saveTasks();
                    this.render();
                    this.showToast(`🗑️ "${task.text}" removida`);
                }
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                    const status = task.completed ? '✅' : '⏳';
                    this.showToast(`${status} "${task.text}" ${task.completed ? 'concluída' : 'reaberta'}`);
                }
            }

            clearAll() {
                if (this.tasks.length === 0) {
                    this.showToast('📭 Nenhuma tarefa para limpar');
                    return;
                }

                if (confirm('⚠️ Excluir TODAS as tarefas?')) {
                    const count = this.tasks.length;
                    this.tasks = [];
                    this.saveTasks();
                    this.render();
                    this.showToast(`🗑️ ${count} tarefa(s) removida(s)`);
                }
            }

            clearAllData() {
                const totalTasks = this.tasks.length;
                const hasProfile = localStorage.getItem('profile') !== null;
                
                let message = '⚠️ Isso excluirá TODOS os dados!\n\n';
                if (totalTasks > 0) message += `📋 ${totalTasks} tarefa(s)\n`;
                if (hasProfile) message += '👤 Perfil do usuário\n';
                message += '\nTem certeza?';
                
                if (confirm(message)) {
                    this.tasks = [];
                    this.saveTasks();
                    
                    localStorage.removeItem('profile');
                    this.profile = {
                        name: 'Usuário',
                        email: 'usuario@email.com',
                        avatar: '👤'
                    };
                    this.updateProfileUI();
                    
                    this.render();
                    this.updateSidebarStats();
                    this.showToast('🗑️ Todos os dados foram removidos');
                    this.closeSidebar();
                }
            }

            // ========== COMPARTILHAR WHATSAPP ==========
            shareWhatsApp() {
                if (this.tasks.length === 0) {
                    this.showToast('📭 Nenhuma tarefa para compartilhar');
                    return;
                }

                // Monta a mensagem
                const total = this.tasks.length;
                const completed = this.tasks.filter(t => t.completed).length;
                const pending = total - completed;
                
                let message = '📋 *Minhas Tarefas*\n';
                message += `📊 Total: ${total} | ✅ Concluídas: ${completed} | ⏳ Pendentes: ${pending}\n\n`;
                message += '━ ━ ━ ━ ━ ━ ━ ━ ━ ━ ━ ━\n\n';
                
                // Lista as tarefas
                this.tasks.forEach((task, index) => {
                    const status = task.completed ? '✅' : '⏳';
                    const numero = (index + 1).toString().padStart(2, '0');
                    
                    let titulo = `${numero}. ${status} ${task.text}`;
                    if (task.ordem) {
                        titulo = `${numero}. ${status} [#${task.ordem}] ${task.text}`;
                    }
                    message += `${titulo}\n`;
                    
                    if (task.obs) {
                        message += `   📝 ${task.obs}\n`;
                    }
                    
                    if (task.endereco) {
                        let enderecoStr = '';
                        const displayName = task.endereco.display_name || this.formatAddressDisplay(task.endereco);
                        const logradouro = task.endereco.logradouro || '';
                        
                        if (logradouro) {
                            const parts = logradouro.split(',');
                            enderecoStr = parts[0].trim();
                        } else if (displayName) {
                            const parts = displayName.split(',');
                            enderecoStr = parts[0].trim();
                        }
                        
                        if (enderecoStr) {
                            message += `   📍 ${enderecoStr}\n`;
                        }
                    }
                    
                    message += '\n';
                });
                
                // Remove o rodapé do relatório

                // Codifica para URL
                const encodedMessage = encodeURIComponent(message);
                const whatsappUrl = `https://wa.me/?text=${encodedMessage}`;
                
                window.open(whatsappUrl, '_blank');
                
                this.showToast('📤 Abrindo WhatsApp para compartilhar');
            }

            // ========== REORDENAÇÃO ==========
            reorderTasks(fromIndex, toIndex) {
                if (fromIndex === toIndex) return;
                
                const task = this.tasks.splice(fromIndex, 1)[0];
                this.tasks.splice(toIndex, 0, task);
                
                this.tasks.forEach((t, i) => t.order = i);
                this.saveTasks();
                
                this.render();
                
                setTimeout(() => {
                    if (this.taskList) {
                        this.taskList.style.overflow = '';
                        this.taskList.style.touchAction = '';
                    }
                }, 50);
            }

            // ========== DRAG & DROP ==========
            startDrag(item, e) {
                if (this.isDraggingActive) return;
                this.isDraggingActive = true;
                
                if (this.longPressTimer) {
                    clearTimeout(this.longPressTimer);
                    this.longPressTimer = null;
                }
                
                this.draggingItem = item;
                this.isDragging = true;
                
                this.taskList.querySelectorAll('.task-item').forEach(el => {
                    el.classList.remove('dragging-mode');
                });
                item.classList.add('dragging-mode');
                item.classList.add('dragging');
                
                const rect = item.getBoundingClientRect();
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                this.dragOffsetY = clientY - rect.top;
                
                this.createDragClone(item, rect);
                
                this.boundOnDragMove = this.onDragMove.bind(this);
                this.boundOnDragEnd = this.onDragEnd.bind(this);
                
                document.addEventListener('mousemove', this.boundOnDragMove);
                document.addEventListener('mouseup', this.boundOnDragEnd);
                document.addEventListener('touchmove', this.boundOnDragMove, { passive: false });
                document.addEventListener('touchend', this.boundOnDragEnd, { passive: false });
                document.addEventListener('touchcancel', this.boundOnDragEnd, { passive: false });
                
                this.taskList.style.overflow = 'hidden';
                this.taskList.style.touchAction = 'none';
            }

            createDragClone(item, rect) {
                if (this.dragClone) {
                    this.dragClone.remove();
                    this.dragClone = null;
                }
                
                const text = item.querySelector('.task-text')?.textContent || 'Tarefa';
                const address = item.querySelector('.task-address .address-text')?.textContent || '';
                
                this.dragClone = document.createElement('div');
                this.dragClone.className = 'drag-clone';
                this.dragClone.innerHTML = `
                    <div class="drag-text">${this.escapeHtml(text)}</div>
                    ${address ? `<div class="drag-address">📍 ${this.escapeHtml(address)}</div>` : ''}
                `;
                this.dragClone.style.width = Math.min(rect.width, 320) + 'px';
                this.dragClone.style.left = '50%';
                this.dragClone.style.top = '50%';
                this.dragClone.style.transform = 'translate(-50%, -50%) scale(1.05) rotate(-2deg)';
                document.body.appendChild(this.dragClone);
            }

            onDragMove(e) {
                e.preventDefault();
                
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                
                if (this.dragClone) {
                    this.dragClone.style.left = clientX + 'px';
                    this.dragClone.style.top = (clientY - this.dragOffsetY) + 'px';
                    this.dragClone.style.transform = 'translate(-50%, 0) scale(1.05) rotate(-2deg)';
                }
                
                const elements = document.elementsFromPoint(clientX, clientY);
                const targetItem = elements.find(el => 
                    el.classList && el.classList.contains('task-item') && el !== this.draggingItem
                );
                
                this.taskList.querySelectorAll('.task-item').forEach(el => {
                    el.classList.remove('drag-over');
                });
                
                if (targetItem) {
                    targetItem.classList.add('drag-over');
                    this.dragOverItem = targetItem;
                    
                    const listRect = this.taskList.getBoundingClientRect();
                    const scrollThreshold = 50;
                    
                    if (clientY < listRect.top + scrollThreshold) {
                        this.scrollList(-10);
                    } else if (clientY > listRect.bottom - scrollThreshold) {
                        this.scrollList(10);
                    } else {
                        this.stopScroll();
                    }
                } else {
                    this.dragOverItem = null;
                    this.stopScroll();
                }
            }

            onDragEnd(e) {
                if (e) {
                    e.preventDefault();
                }
                
                this.isDragging = false;
                this.isDraggingActive = false;
                this.stopScroll();
                
                this.taskList.querySelectorAll('.task-item').forEach(el => {
                    el.classList.remove('dragging', 'drag-over', 'dragging-mode');
                });
                
                if (this.dragClone) {
                    this.dragClone.remove();
                    this.dragClone = null;
                }
                
                document.removeEventListener('mousemove', this.boundOnDragMove);
                document.removeEventListener('mouseup', this.boundOnDragEnd);
                document.removeEventListener('touchmove', this.boundOnDragMove);
                document.removeEventListener('touchend', this.boundOnDragEnd);
                document.removeEventListener('touchcancel', this.boundOnDragEnd);
                
                this.taskList.style.overflow = '';
                this.taskList.style.touchAction = '';
                
                if (this.draggingItem && this.dragOverItem) {
                    const fromIndex = parseInt(this.draggingItem.dataset.index);
                    const toIndex = parseInt(this.dragOverItem.dataset.index);
                    
                    if (!isNaN(fromIndex) && !isNaN(toIndex) && fromIndex !== toIndex) {
                        this.reorderTasks(fromIndex, toIndex);
                        this.showToast('🔄 Tarefa movida');
                    }
                }
                
                this.draggingItem = null;
                this.dragOverItem = null;
                this.boundOnDragMove = null;
                this.boundOnDragEnd = null;
            }

            scrollList(direction) {
                if (this.scrollInterval) return;
                this.scrollInterval = setInterval(() => {
                    if (this.taskList) {
                        this.taskList.scrollBy(0, direction);
                    }
                }, 16);
            }

            stopScroll() {
                if (this.scrollInterval) {
                    clearInterval(this.scrollInterval);
                    this.scrollInterval = null;
                }
            }

            // ========== FILTROS ==========
            getFilteredTasks() {
                let filtered = this.tasks;
                
                switch (this.currentFilter) {
                    case 'pending': 
                        filtered = filtered.filter(t => !t.completed);
                        break;
                    case 'completed': 
                        filtered = filtered.filter(t => t.completed);
                        break;
                    default: 
                        break;
                }
                
                return filtered;
            }

            // ========== RENDERIZAÇÃO ==========
            render() {
                const filteredTasks = this.getFilteredTasks();
                const total = this.tasks.length;
                const pending = this.tasks.filter(t => !t.completed).length;
                
                if (this.showingCount) {
                    this.showingCount.textContent = filteredTasks.length;
                }
                if (this.pendingCount) {
                    this.pendingCount.textContent = pending;
                }
                
                if (filteredTasks.length === 0) {
                    const messages = {
                        'all': {
                            icon: '📝',
                            text: 'Nenhuma tarefa cadastrada',
                            sub: 'Toque no botão ✚ para adicionar'
                        },
                        'pending': {
                            icon: '🎉',
                            text: 'Todas as tarefas foram concluídas!',
                            sub: 'Parabéns! Você está em dia'
                        },
                        'completed': {
                            icon: '📌',
                            text: 'Nenhuma tarefa concluída',
                            sub: 'Marque as tarefas como concluídas'
                        }
                    };
                    const msg = messages[this.currentFilter] || messages.all;
                    this.taskList.innerHTML = `
                        <div class="empty-message">
                            <span class="empty-icon">${msg.icon}</span>
                            ${msg.text}
                            <div class="empty-sub">${msg.sub}</div>
                        </div>
                    `;
                    return;
                }

                this.taskList.innerHTML = filteredTasks.map((task, index) => {
                    let metaParts = [];
                    if (task.ordem) {
                        metaParts.push(`<span class="meta-item"><span class="meta-label">#</span><span class="meta-value">${this.escapeHtml(task.ordem)}</span></span>`);
                    }
                    if (task.obs) {
                        metaParts.push(`<span class="meta-item"><span class="meta-label">📝</span><span class="meta-value">${this.escapeHtml(task.obs)}</span></span>`);
                    }
                    const metaHtml = metaParts.length > 0 ? `<div class="task-meta">${metaParts.join('')}</div>` : '';
                    
                    return `
                        <li class="task-item ${task.completed ? 'completed' : 'pending'}" 
                            data-id="${task.id}" 
                            data-index="${index}">
                            <div class="task-main">
                                <span class="drag-handle">⠿</span>
                                <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''}>
                                <span class="task-text">${this.escapeHtml(task.text)}</span>
                                <span class="task-date">${task.createdAt || ''}</span>
                                <div class="task-actions">
                                    <button class="action-btn edit-btn" title="Editar tarefa" data-action="edit">✏️</button>
                                    <button class="action-btn delete-btn" title="Excluir tarefa" data-action="delete">×</button>
                                </div>
                            </div>
                            ${metaHtml}
                            ${task.endereco ? this.renderEndereco(task.endereco) : ''}
                        </li>
                    `;
                }).join('');

                this.setupDragAndDrop();
                
                // Event delegation para os botões de ação
                this.taskList.querySelectorAll('[data-action="edit"]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const taskItem = btn.closest('.task-item');
                        if (taskItem) {
                            const taskId = parseInt(taskItem.dataset.id);
                            this.openTaskModal(taskId);
                        }
                    });
                });
                
                setTimeout(() => {
                    if (this.taskList) {
                        this.taskList.style.overflow = '';
                        this.taskList.style.touchAction = '';
                    }
                }, 100);
            }

            renderEndereco(endereco) {
                const enderecoStr = endereco.display_name || this.formatAddressDisplay(endereco);
                const lat = endereco.lat || '';
                const lon = endereco.lon || '';
                const query = encodeURIComponent(enderecoStr);
                
                const googleMapsUrl = lat && lon 
                    ? `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`
                    : `https://www.google.com/maps/search/?api=1&query=${query}`;
                
                const wazeUrl = lat && lon
                    ? `https://waze.com/ul?ll=${lat},${lon}&navigate=yes`
                    : `https://waze.com/ul?q=${query}&navigate=yes`;

                const googleIcon = `
                    <span class="google-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                        </svg>
                    </span>
                `;

                const wazeIcon = `
                    <span class="waze-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                        </svg>
                    </span>
                `;

                return `
                    <div class="task-address">
                        <span class="address-icon">📍</span>
                        <span class="address-text">${this.escapeHtml(enderecoStr)}</span>
                        <div class="address-actions">
                            <a href="${googleMapsUrl}" target="_blank" class="address-link google" title="Abrir no Google Maps">
                                ${googleIcon} Google
                            </a>
                            <a href="${wazeUrl}" target="_blank" class="address-link waze" title="Abrir no Waze">
                                ${wazeIcon} Waze
                            </a>
                        </div>
                    </div>
                `;
            }

            setupDragAndDrop() {
                const items = this.taskList.querySelectorAll('.task-item');
                
                items.forEach(item => {
                    let longPressTimer = null;
                    let isLongPress = false;
                    let touchStartY = 0;
                    let touchStartX = 0;
                    let isSwiping = false;
                    
                    item.addEventListener('mousedown', (e) => {
                        if (e.target.closest('.task-checkbox') || e.target.closest('.action-btn')) {
                            return;
                        }
                        this.startDrag(item, e);
                    });

                    item.addEventListener('touchstart', (e) => {
                        if (e.target.closest('.task-checkbox') || e.target.closest('.action-btn')) {
                            return;
                        }
                        
                        const touch = e.touches[0];
                        touchStartY = touch.clientY;
                        touchStartX = touch.clientX;
                        isSwiping = false;
                        isLongPress = false;
                        
                        longPressTimer = setTimeout(() => {
                            isLongPress = true;
                            if (navigator.vibrate) {
                                navigator.vibrate(30);
                            }
                            
                            this.startDrag(item, e);
                            
                            item.classList.add('long-press');
                            setTimeout(() => {
                                item.classList.remove('long-press');
                            }, 600);
                            
                            this.showToast('↕️ Arraste para reordenar');
                        }, 500);
                    }, { passive: true });

                    item.addEventListener('touchmove', (e) => {
                        const touch = e.touches[0];
                        const deltaY = Math.abs(touch.clientY - touchStartY);
                        const deltaX = Math.abs(touch.clientX - touchStartX);
                        
                        if (deltaY > 10 || deltaX > 10) {
                            isSwiping = true;
                            if (longPressTimer) {
                                clearTimeout(longPressTimer);
                                longPressTimer = null;
                            }
                        }
                    }, { passive: true });

                    item.addEventListener('touchend', (e) => {
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                        }
                    }, { passive: true });

                    item.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                    });
                });
            }

            // ========== UTILITÁRIOS ==========
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            showToast(message) {
                this.toast.textContent = message;
                this.toast.classList.add('show');
                
                clearTimeout(this.toast._timeout);
                this.toast._timeout = setTimeout(() => {
                    this.toast.classList.remove('show');
                }, 3000);
            }

            // ========== EVENTOS ==========
            bindEvents() {
                // Sidebar
                this.menuToggle.addEventListener('click', () => this.toggleSidebar());
                this.sidebarOverlay.addEventListener('click', () => this.closeSidebar());

                // Menu items
                this.menuItems.forEach(item => {
                    item.addEventListener('click', () => {
                        const page = item.dataset.page;
                        if (page === 'profile') {
                            this.openProfileModal();
                        } else if (page === 'stats') {
                            this.showStats();
                        } else if (page === 'settings') {
                            this.showSettings();
                        } else {
                            this.menuItems.forEach(i => i.classList.remove('active'));
                            item.classList.add('active');
                            this.closeSidebar();
                        }
                    });
                });

                // Perfil
                this.profileAvatar.addEventListener('click', () => this.openProfileModal());
                
                this.profileForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = this.modalName.value.trim();
                    const email = this.modalEmail.value.trim();
                    
                    if (!name || !email) {
                        this.showToast('⚠️ Preencha todos os campos');
                        return;
                    }

                    this.profile.name = name;
                    this.profile.email = email;
                    this.saveProfile();
                    this.closeProfileModal();
                    this.showToast('✅ Perfil atualizado!');
                });

                this.modalProfileClose.addEventListener('click', () => this.closeProfileModal());
                this.profileModal.addEventListener('click', (e) => {
                    if (e.target === this.profileModal) this.closeProfileModal();
                });

                // Ações
                this.clearAllData.addEventListener('click', () => this.clearAllData());
                this.logoutBtn.addEventListener('click', () => {
                    if (confirm('Deseja realmente sair?')) {
                        this.showToast('👋 Até logo!');
                        this.closeSidebar();
                    }
                });

                // FAB - Adicionar
                this.fabAddTask.addEventListener('click', () => this.openTaskModal());

                // FAB - Compartilhar WhatsApp
                this.fabShareWhatsApp.addEventListener('click', () => this.shareWhatsApp());

                // Modal Tarefa
                this.modalTaskClose.addEventListener('click', () => this.closeTaskModal());
                this.taskModal.addEventListener('click', (e) => {
                    if (e.target === this.taskModal) this.closeTaskModal();
                });

                // Buscar endereço com DELAY CORRIGIDO (800ms)
                this.modalSearchBtn.addEventListener('click', () => {
                    if (this.searchTimeout) {
                        clearTimeout(this.searchTimeout);
                    }
                    this.buscarEnderecoModal(this.modalAddressSearch.value);
                });

                this.modalAddressSearch.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (this.searchTimeout) {
                            clearTimeout(this.searchTimeout);
                        }
                        this.buscarEnderecoModal(this.modalAddressSearch.value);
                    }
                });

                this.modalAddressSearch.addEventListener('input', () => {
                    clearTimeout(this.searchTimeout);
                    const query = this.modalAddressSearch.value;
                    if (query.length >= 3) {
                        this.searchTimeout = setTimeout(() => {
                            this.buscarEnderecoModal(query);
                        }, 800);
                    } else {
                        this.modalSuggestions.classList.remove('active');
                    }
                });

                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.modal-address-section')) {
                        this.modalSuggestions.classList.remove('active');
                    }
                });

                this.modalClearAddress.addEventListener('click', () => {
                    this.clearModalAddress();
                });

                // Submeter tarefa (criar ou editar)
                this.taskForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const endereco = this.selectedAddress ? { ...this.selectedAddress } : null;
                    const ordem = this.taskOrder.value.trim();
                    const obs = this.taskObs.value.trim();
                    const text = this.taskInput.value.trim();
                    
                    const editId = parseInt(this.editTaskId.value);
                    
                    if (editId) {
                        this.updateTask(editId, text, endereco, ordem, obs);
                    } else {
                        this.addTask(text, endereco, ordem, obs);
                    }
                });

                // Event delegation para tarefas (checkbox)
                this.taskList.addEventListener('click', (e) => {
                    if (e.target.classList.contains('task-checkbox')) {
                        const taskItem = e.target.closest('.task-item');
                        if (taskItem) {
                            const taskId = parseInt(taskItem.dataset.id);
                            this.toggleTask(taskId);
                        }
                    }
                });

                // Filtros
                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.filterBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentFilter = btn.dataset.filter;
                        this.render();
                    });
                });

                // Gestos para fechar sidebar
                let touchStartX = 0;
                let touchEndX = 0;
                
                document.addEventListener('touchstart', (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });

                document.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    if (touchStartX - touchEndX > 80 && this.sidebar.classList.contains('open')) {
                        this.closeSidebar();
                    }
                }, { passive: true });
            }

            // ========== PÁGINAS ==========
            showStats() {
                const total = this.tasks.length;
                const completed = this.tasks.filter(t => t.completed).length;
                const pending = total - completed;
                const withAddress = this.tasks.filter(t => t.endereco).length;
                
                const status = this.isOnline ? '🟢 Online' : '🔴 Offline';
                
                this.showToast(
                    `📊 Total: ${total} | ✅ Concluídas: ${completed} | ⏳ Pendentes: ${pending} | 📍 Com endereço: ${withAddress} | ${status}`
                );
                this.closeSidebar();
            }

            showSettings() {
                this.showToast('⚙️ Configurações em breve!');
                this.closeSidebar();
            }
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            const app = new TaskManager();
            console.log('✅ App com Edição, PWA e WhatsApp simplificado!');
            console.log(`📊 ${app.tasks.length} tarefas`);
            console.log(`📶 Status: ${app.isOnline ? 'Online' : 'Offline'}`);
            console.log('🚀 Desenvolvido por Adriano Monteiro');
            console.log('📧 Contato: adri0mt@uni9.edu.br');
            window.app = app;
        });
    </script>
